version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cooplubbers_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: cooplubbers_test
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - "./Database/Dump20240103 (3).sql:/docker-entrypoint-initdb.d/init.sql"
      - "./Database/shops_schema.sql:/docker-entrypoint-initdb.d/shops.sql"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
